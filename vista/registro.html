<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CLUB ACERIAS</title>
    <link rel="stylesheet" href="../assets/css/estilos.css">
</head>

<body>
    <div class="formulario">
        <h2>Registro de asociados - Acerias</h2>

        <form id="FormRegistro" action="" method="post">
            <div class="grupo-input" class="grupo-input">
                <label>Ingresar Documento:</label>
                <input type="number" id="documento" placeholder="1938392928">
            </div>

            <div class="grupo-input">
                <label>Ingresar el Nombre</label>
                <input type="text" id="nombre" required placeholder="pepito perez">
            </div>

            <div class="grupo-input">
                <label>Ingresar el Apellido</label>
                <input type="text" id="apellido" required placeholder="perez sanches">
            </div>

            <div class="grupo-input">
                <label>Ingresar la Fecha de Nacimiento</label>
                <input type="date" id="fechaNacimiento" required placeholder="20/20/2020">
            </div>

            <div class="grupo-input">
                <label>Ingresar el Genero</label>
                <div class="grupo-radio">
                    <label>
                        <input type="radio" id="Masculino" value="M">
                        <span>Masculino</span>
                    </label>
                    <label>
                        <input type="radio" id="Femenino" value="F">
                        <span>Femenino</span>
                    </label>
                    <label>
                        <input type="radio" id="otro" value="otro">
                        <span>Otro</span>
                    </label>
                </div>
            </div>

            <div class="grupo-input">
                <label>Ingresar la Direccion</label>
                <input type="text" id="direccionResidencia" required placeholder=" cra 21 #3-09">
            </div>

            <div class="grupo-input">
                <label>Ingresar la Ciudad</label>
                <select id="ciudad" required>
                    <option value="sogamoso">sogamoso</option>
                    <option value="duitama">duitama</option>
                    <option value="cerinza">cerinza</option>
                </select>
            </div>

            <div class="grupo-input">
                <label>Ingresar el Email</label>
                <input type="email" id="email" required placeholder="pepito@gmail.com">
            </div>

            <div class="grupo-input">
                <label>Ingresar el Telefono</label>
                <input type="tel" id="telefono" required placeholder=" 31548576485">
            </div>

            <div class="grupo-botones">
                <button type="submit">guardar</button>
                <button type="reset">limpiar formulario</button>
            </div>

            <div class="iniciar-sesion">
                <p>Ya tienes una cuenta? <a href="login.html">Iniciar sesion</a></p>
            </div>
    </div>
    </form>
    </div>
</body>

</html>
