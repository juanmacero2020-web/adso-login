<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CLUB ACERIAS</title>
    <link rel="stylesheet" href="../assets/css/estilos.css">
</head>

<body>

    <div>
        <h2>INICIAR SESION</h2>

        <form id="formLogin" action="" method="post">

            <div class="grupo-input">
                <label for="email">Ingresar el Email:</label>
                <input type="email" id="email" name="email" required placeholder="pepito@gmail.com">
            </div>

            <div class="grupo-input">
                <label for="password">Ingresar Contraseña:</label>
                <input type="password" id="password" name="password" required placeholder="********">
            </div>

            <div class="grupo-botones">
                <button type="submit">Iniciar Sesion</button>
            </div>

            <div class="crear-cuenta">
                <p>¿No tienes una cuenta? <a href="registro.html">Crear cuenta</a></p>
            </div>

        </form>

    </div>

    <script src="../controladores/login.js"></script>
</body>

</html>
